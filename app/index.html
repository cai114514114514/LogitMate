<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LogitMate</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <script src="/cubism/live2dcubismcore.min.js"></script>
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <div id="talk">
      <div id="bubble" class="ui" hidden><span id="bubble-text"></span></div>
      <form id="ask" class="ui" hidden autocomplete="off">
        <input id="ask-input" placeholder="Say something… (Esc to close)" spellcheck="false" />
      </form>
      <form id="focus" class="ui" hidden autocomplete="off">
        <input id="focus-task" spellcheck="false" />
        <div id="focus-lengths"></div>
      </form>
      <div id="focus-pill" class="ui" hidden>
        <span id="focus-time"></span><span id="focus-label"></span><button id="focus-stop" type="button">×</button>
      </div>
    </div>
    <canvas id="stage"></canvas>
    <div id="peek" hidden>👀</div>
    <div id="toast" hidden></div>
  </body>
</html>
